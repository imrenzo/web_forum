# Postgres only (for local development). The Go server and the React client run on the host.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres # local development only
      POSTGRES_DB: web_forum
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # runs once, when the data volume is first created
      - ./server/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
volumes:
  pgdata:
